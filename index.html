<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>LevelUp HTML</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!--icon for web app -->
    <link rel="icon" href="favicon.ico" />
    <!--google fonts (3 lines of code)-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bungee+Shade&family=Dancing+Script:wght@600&family=Inter:opsz@14..32&display=swap" rel="stylesheet">

  <body>
    <header>

        <a class="navbar-brand">LevelUP</a>
        <menu>
            <li class="nav-item"><a href="index.html">Home</a></li>
            <li class="nav-item"><a href="about.html">About</a></li>

    <main>
        <h1 id="welcome-header">Welcome to</h1>
        <h1 id="levelup-header">LevelUP</h1>
      <h1 id="login-header">Login or sign up to get started!</h1>
      <form method="get" action="select.html">
        <div class="login-input">
          <input type="text" placeholder="your@email.com" />
        </div>
        <div class="login-input">
          <input type="password" placeholder="password" />
        </div>
        <div class="d-flex justify-content-center gap-2">
            <button class="btn btn-primary btn-sm">Login</button>
            <button class="btn btn-outline-light btn-sm">Sign Up</button>
        </div>
      </form>
    </main>
    <footer>
